name: Vortex Set User Role

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: "Database User ID"
        required: true
        type: string

      role:
        description: "Role"
        required: true
        type: choice
        options:
          - USER
          - CREATOR
          - ARTIST
          - MODERATOR
          - ADMIN

jobs:
  update-role:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      TARGET_USER_ID: ${{ inputs.user_id }}
      TARGET_ROLE: ${{ inputs.role }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Update database role
        run: npx tsx scripts/set-user-role.ts
