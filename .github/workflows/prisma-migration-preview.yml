name: Prisma Initial Migration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-migration:
    runs-on: ubuntu-latest

    env:
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate initial migration
        run: |
          mkdir -p prisma/migrations/0001_vortex_initial

          npx prisma migrate diff \
            --from-empty \
            --to-schema prisma/schema.prisma \
            --script \
            --output prisma/migrations/0001_vortex_initial/migration.sql

      - name: Verify migration
        run: |
          test -s prisma/migrations/0001_vortex_initial/migration.sql

          echo "Migration lines:"
          wc -l prisma/migrations/0001_vortex_initial/migration.sql

          echo ""
          echo "Tables:"
          grep -E '^CREATE TABLE' prisma/migrations/0001_vortex_initial/migration.sql || true

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add prisma/migrations/0001_vortex_initial/migration.sql

          if git diff --cached --quiet; then
            echo "Migration already exists."
          else
            git commit -m "db: add initial Vortex migration"
            git push origin main
          fi
