name: Prisma Migration Preview

on:
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest

    env:
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Create migration preview
        run: |
          mkdir -p prisma/migration-preview
          npx prisma migrate diff \
            --from-empty \
            --to-schema prisma/schema.prisma \
            --script \
            --output prisma/migration-preview/migration.sql

      - name: Show migration summary
        run: |
          echo "Migration SQL lines:"
          wc -l prisma/migration-preview/migration.sql
          echo ""
          echo "Created tables:"
          grep -E '^CREATE TABLE' prisma/migration-preview/migration.sql || true

      - name: Upload migration preview
        uses: actions/upload-artifact@v4
        with:
          name: vortex-initial-migration
          path: prisma/migration-preview/migration.sql
          if-no-files-found: error
