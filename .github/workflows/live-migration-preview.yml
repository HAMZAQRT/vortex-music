name: Vortex Live Migration Preview

on:
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest

    env:
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Live migration preview
        run: |
          mkdir -p prisma/live-migration-preview

          npx prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --script \
            --output prisma/live-migration-preview/migration.sql

      - name: Inspect migration
        run: |
          echo "=== SQL LINES ==="
          wc -l prisma/live-migration-preview/migration.sql

          echo ""
          echo "=== CREATE statements ==="
          grep -E '^CREATE (TYPE|TABLE|INDEX|UNIQUE INDEX)' \
            prisma/live-migration-preview/migration.sql || true

          echo ""
          echo "=== ALTER statements ==="
          grep -E '^ALTER TABLE' \
            prisma/live-migration-preview/migration.sql || true

          echo ""
          echo "=== DESTRUCTIVE CHECK ==="

          if grep -E '^(DROP|TRUNCATE|DELETE FROM)' \
            prisma/live-migration-preview/migration.sql; then
            echo "ERROR: destructive SQL detected"
            exit 1
          else
            echo "OK: no DROP/TRUNCATE/DELETE detected"
          fi

      - name: Upload migration preview
        uses: actions/upload-artifact@v4
        with:
          name: vortex-live-migration-preview
          path: prisma/live-migration-preview/migration.sql
          if-no-files-found: error
